<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Server Launcher</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div><div class="brand">MY SERVER</div><div class="subtitle">CUSTOM MINECRAFT LAUNCHER</div></div><div id="status" class="status">Готов</div></header><main><section class="hero"><div><span class="badge">SERVER CLIENT</span><h1>Подготовка к вайпу</h1><p>Лаунчер скачает клиентские файлы с HTTPS manifest и подготовит сборку сервера.</p></div><button id="sync" class="secondary">Синхронизировать</button></section><section class="grid"><div class="card"><h2>Сервер</h2><label>Адрес сервера</label><input id="serverAddress" placeholder="play.example.ru:25565"><label>HTTPS Manifest URL</label><input id="manifestUrl" placeholder="https://example.ru/launcher/manifest.json"><div class="row"><div><label>Minecraft</label><input id="minecraftVersion" value="1.21.1"></div><div><label>Загрузчик</label><input id="modLoader" value="NeoForge"></div></div></div><div class="card"><h2>Память</h2><label>RAM, MB</label><input id="ramMb" type="number" min="2048" step="512" value="4096"><p class="muted">Позже это значение будет передаваться JVM при запуске Minecraft.</p><button id="save" class="secondary wide">Сохранить настройки</button></div></section><section class="bottom"><div id="log" class="log">Логи лаунчера появятся здесь.</div><button id="launch" class="launch">ИГРАТЬ</button></section></main></div><script src="renderer.js"></script></body></html>
